              - code [ref=e1012]: CREATE TABLE public.reading_list ( id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, title text NOT NULL, author text NOT NULL, category text, status text CHECK (status IN ('未读', '在读', '已读')), rating numeric(2,1) CHECK (rating BETWEEN 0 AND 5), pages integer, start_date date, finish_date date, notes text, created_at timestamptz NOT NULL DEFAULT now(), UNIQUE (title, author));INSERT INTO public.reading_list (title, author, category, status, rating, pages, start_date, finish_date, notes)SELECT t.title || '（第' || ((n - 1) / 10 + 1)::text || '版）', t.author, t.category, (ARRAY['未读', '在读', '已读'])[(n - 1) % 3 + 1], CASE WHEN (n - 1) % 3 = 2 THEN round((3.0 + (n % 21) / 10.0)::numeric, 1) END, t.pages, DATE '2025-01-01' + ((n - 1) * 3), CASE WHEN (n - 1) % 3 = 2 THEN DATE '2025-01-01' + ((n - 1) * 3 + 10 + n % 15) END, '批次 ' || ((n - 1) / 10 + 1)::text || '，第 ' || n::text || ' 条'FROM generate_series(1, 100) AS nJOIN (VALUES (1, '深入理解计算机系统', 'Randal E. Bryant', '计算机', 737), (2, '三体', '刘慈欣', '科幻', 302), (3, '人类简史', '尤瓦尔·赫拉利', '历史', 440), (4, '万历十五年', '黄仁宇', '历史', 286), (5, '思考，快与慢', '丹尼尔·卡尼曼', '心理学', 418), (6, '活着', '余华', '文学', 191), (7, '国富论', '亚当·斯密', '经济学', 562), (8, '时间简史', '史蒂芬·霍金', '科普', 210), (9, '围城', '钱锺书', '文学', 359), (10, '原则', '瑞·达利欧', '管理', 566)) AS t(idx, title, author, category, pages) ON t.idx = (n - 1) % 10 + 1;
