['Randal Bryant','刘慈欣','尤瓦尔·赫拉利','黄仁宇','丹尼尔·卡尼曼','余华','亚当·斯密','史蒂芬·霍金','钱锺书','瑞·达利欧'])[(n - 1) % 10 + 1], (ARRAY['计算机','科幻','历史','历史','心理','文学','经济','科普','文学','管理'])[(n - 1) % 10 + 1], ... ``` 这样有点花哨但也可用。或者更简洁地生成。保持合理即可。 日期：start_date = DATE '2024-01-01' + (n - 1) * 3，finish_date = start_date + (7 + n % 14)。status 由 finish_date 决定。 用 CTE 更清晰： ```sql INSERT INTO public.reading_list (title, author, category, status, rating, pages, start_date, finish_date, notes) SELECT '书籍 ' || lpad(n::text, 3, '0'), '作者 ' || ((n - 1) % 20 + 1), ... ``` 我倾向使用真实书名数组，看起来更\"阅读清单\"。给 10 本真实书循环，加序号区分。 SQL： ```sql CREATE TABLE public.reading_list ( id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, title text NOT NULL, author text NOT NULL, category text, status text CHECK (status IN ('未读','在读','已读')), rating numeric(2,1) CHECK (rating BETWEEN 0 AND 5), pages integer, start_date date, finish_date date, notes text, created_at timestamptz NOT NULL DEFAULT now(), UNIQUE (title, author) ); INSERT INTO public.reading_list (title, author, category, status, rating, pages, start_date, finish_date, notes) SELECT t.title || '（第' || ((n - 1) / 10 + 1)::text || '版）', t.author, t.category, (ARRAY['未读','在读','已读'])[(n - 1) % 3 + 1], CASE WHEN (n - 1) % 3 = 2 THEN round((3.0 + (n % 21) / 10.0)::numeric, 1) END, t.pages, DATE '2025-01-01' + ((n - 1) * 3), CASE WHEN (n - 1) % 3 = 2 THEN DATE '2025-01-01' + ((n - 1) * 3 + 10 + n % 15) END, '批次 ' || ((n - 1) / 10 + 1)::text || '，第 ' || n::text || ' 条' FROM generate_series(1, 100) AS n JOIN (VALUES (1, '深入理解计算机系统', 'Randal E. Bryant', '计算机', 737), ... ) AS t(idx, title, author, category, pages) ON t.idx = (n - 1) % 10 + 1; ``` VALUES 里需要 10 行。写得简洁，用 LATERAL?直接用 (VALUES ...) AS t(idx,title,author,category,pages)。 字数可控。可以。 但标注版次会让 title 与 author 组合重复通过 UNIQUE？每个 n 唯一，没问题。 好，输出。 另外还要注意 rating numeric(2,1) 范围：3.0~5.0 可以。 n % 21 → 0..20, /10.0 → 0..2.0, +3.0 → 3.0..5.0 ✓。 写完后询问确认。"
